<svg viewBox="0 0 320 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <clipPath id="screen-cn">
      <rect x="8" y="8" width="304" height="644" rx="26"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="320" height="660" rx="32" fill="#0B0F1A"/>

  <g clip-path="url(#screen-cn)">
    <rect x="8" y="8" width="304" height="644" fill="#F1F2F5"/>

    <rect x="8" y="8" width="304" height="20" fill="#1E4FB8"/>
    <text x="24" y="22" font-size="10" fill="#FFFFFF">9:41</text>

    <!-- toolbar (2 lines) -->
    <rect x="8" y="28" width="304" height="60" fill="#1E4FB8"/>
    <path d="M 30 58 l 8 -8 M 30 58 l 8 8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <text x="50" y="60" font-size="15" font-weight="bold" fill="#FFFFFF">Conteo físico</text>
    <text x="50" y="76" font-size="10" fill="#D7E2FA">4 LTS · 04 ene 2026</text>

    <!-- toggle group -->
    <rect x="24" y="98" width="132" height="30" rx="8" fill="#1E4FB8"/>
    <text x="90" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Número</text>
    <rect x="164" y="98" width="112" height="30" rx="8" fill="none" stroke="#1E4FB8" stroke-width="1.4"/>
    <text x="220" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1E4FB8">Texto</text>

    <!-- codigo + stock -->
    <rect x="24" y="138" width="132" height="50" rx="10" fill="#FFFFFF" stroke="#D8DCE4"/>
    <text x="34" y="154" font-size="8" letter-spacing="1" fill="#5C6A82">CÓDIGO</text>
    <text x="34" y="174" font-size="13" fill="#14203A">10292</text>
    <circle cx="140" cy="169" r="6" fill="none" stroke="#5C6A82" stroke-width="1.4"/>
    <line x1="144.5" y1="173.5" x2="149" y2="178" stroke="#5C6A82" stroke-width="1.4" stroke-linecap="round"/>

    <rect x="164" y="138" width="112" height="50" rx="10" fill="#F7F8FA" stroke="#D8DCE4"/>
    <text x="174" y="154" font-size="8" letter-spacing="1" fill="#5C6A82">STOCK</text>
    <text x="174" y="174" font-size="13" fill="#5C6A82">1.200</text>

    <!-- description chip -->
    <rect x="24" y="196" width="90" height="22" rx="11" fill="#E4ECFB"/>
    <text x="69" y="211" text-anchor="middle" font-size="10" font-weight="bold" fill="#0B2B66">THINNER E</text>

    <!-- cantidad + diferencia -->
    <rect x="24" y="228" width="132" height="50" rx="10" fill="#FFFFFF" stroke="#D8DCE4"/>
    <text x="34" y="244" font-size="8" letter-spacing="1" fill="#5C6A82">CANTIDAD</text>
    <text x="34" y="264" font-size="13" fill="#14203A">1.500</text>

    <rect x="164" y="228" width="112" height="50" rx="10" fill="#F7F8FA" stroke="#D8DCE4"/>
    <text x="174" y="244" font-size="8" letter-spacing="1" fill="#5C6A82">DIFERENCIA</text>
    <text x="174" y="264" font-size="13" fill="#1F8A57">+0.300</text>

    <!-- lugar dropdown -->
    <rect x="24" y="288" width="252" height="46" rx="10" fill="#FFFFFF" stroke="#D8DCE4"/>
    <text x="34" y="304" font-size="8" letter-spacing="1" fill="#5C6A82">LUGAR</text>
    <text x="34" y="323" font-size="12.5" fill="#14203A">Almacén</text>
    <path d="M 262 314 l 5 6 l 5 -6" fill="none" stroke="#5C6A82" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- buttons -->
    <rect x="24" y="346" width="150" height="38" rx="9" fill="#1E4FB8"/>
    <text x="99" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Agregar</text>
    <rect x="182" y="346" width="94" height="38" rx="9" fill="none" stroke="#1E4FB8" stroke-width="1.4"/>
    <text x="229" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E4FB8">Cancelar</text>

    <!-- buscador de conteos registrados -->
    <rect x="24" y="396" width="252" height="40" rx="10" fill="#FFFFFF" stroke="#D8DCE4"/>
    <circle cx="44" cy="416" r="6" fill="none" stroke="#5C6A82" stroke-width="1.4"/>
    <line x1="48.5" y1="420.5" x2="53" y2="425" stroke="#5C6A82" stroke-width="1.4" stroke-linecap="round"/>
    <text x="62" y="421" font-size="12" fill="#14203A">1100</text>
    <text x="24" y="450" font-size="9.5" fill="#5C6A82">1 registro encontrado</text>

    <!-- list header -->
    <text x="24" y="470" font-size="9" letter-spacing="1" fill="#5C6A82">ID</text>
    <text x="140" y="470" font-size="9" letter-spacing="1" fill="#5C6A82">CANTIDAD</text>
    <text x="276" y="470" text-anchor="end" font-size="9" letter-spacing="1" fill="#5C6A82">ACCIÓN</text>

    <rect x="24" y="478" width="252" height="60" rx="10" fill="#FFFFFF" stroke="#D8DCE4"/>
    <text x="34" y="500" font-size="12" fill="#14203A">1100</text>
    <text x="140" y="500" font-size="12" fill="#14203A">5.000</text>
    <path d="M 244 492 l 8 -8 l 4 4 l -8 8 h-4z" fill="none" stroke="#5C6A82" stroke-width="1.3"/>
    <path d="M 264 488 h 10 M 266 488 v -3 h 6 v 3 M 266 491 l 1 9 h 6 l 1 -9" fill="none" stroke="#C43B3B" stroke-width="1.3"/>

    <!-- resumen button -->
    <rect x="24" y="552" width="252" height="40" rx="9" fill="none" stroke="#1E4FB8" stroke-width="1.4"/>
    <text x="150" y="577" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E4FB8">Resumen</text>
  </g>

  <rect x="4" y="4" width="312" height="652" rx="30" fill="none" stroke="#1a1f2b" stroke-width="4"/>
</svg>
