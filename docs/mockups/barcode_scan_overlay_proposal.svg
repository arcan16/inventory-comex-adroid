<svg viewBox="0 0 320 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <clipPath id="screen-bso">
      <rect x="8" y="8" width="304" height="644" rx="26"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="320" height="660" rx="32" fill="#0B0F1A"/>

  <g clip-path="url(#screen-bso)">
    <rect x="8" y="8" width="304" height="644" fill="#F1F2F5"/>

    <!-- Conteo Normal de fondo (atenuado): esta app no cambia, solo se ve detras del modal -->
    <rect x="8" y="8" width="304" height="20" fill="#1E4FB8"/>
    <rect x="8" y="28" width="304" height="60" fill="#1E4FB8"/>
    <path d="M 30 58 l 8 -8 M 30 58 l 8 8" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <text x="50" y="60" font-size="15" font-weight="bold" fill="#FFFFFF">Conteo físico</text>
    <text x="50" y="76" font-size="10" fill="#D7E2FA">4 LTS · 04 ene 2026</text>
    <rect x="24" y="98" width="132" height="30" rx="8" fill="#1E4FB8"/>
    <text x="90" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#FFFFFF">Número</text>
    <rect x="164" y="98" width="112" height="30" rx="8" fill="none" stroke="#1E4FB8" stroke-width="1.4"/>
    <text x="220" y="118" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1E4FB8">Texto</text>
    <rect x="24" y="138" width="150" height="50" rx="10" fill="#FFFFFF" stroke="#D8DCE4"/>
    <text x="34" y="154" font-size="8" letter-spacing="1" fill="#5C6A82">CÓDIGO</text>
    <rect x="182" y="138" width="94" height="50" rx="10" fill="#F7F8FA" stroke="#D8DCE4"/>
    <text x="192" y="154" font-size="8" letter-spacing="1" fill="#5C6A82">STOCK</text>
    <rect x="24" y="228" width="90" height="22" rx="11" fill="#E4ECFB"/>
    <rect x="24" y="260" width="252" height="50" rx="10" fill="#FFFFFF" stroke="#D8DCE4"/>

    <!-- scrim -->
    <rect x="8" y="8" width="304" height="272" fill="#000000" opacity="0.45"/>

    <!-- Modal del scanner: mismos colores/UI reales de la app barcode-scanner -->
    <rect x="8" y="280" width="304" height="372" rx="24" fill="#F6FAF8"/>
    <rect x="145" y="294" width="30" height="4" rx="2" fill="#BFC9C5"/>

    <text x="160" y="322" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#171D1B">Escanear código de barras</text>

    <!-- pulso + boton (identico al de la app BarcodeScanner) -->
    <circle cx="160" cy="404" r="68" fill="#0B6B5D" opacity="0.10"/>
    <circle cx="160" cy="404" r="52" fill="#0B6B5D" opacity="0.16"/>
    <circle cx="160" cy="404" r="42" fill="#0B6B5D"/>
    <rect x="150.5" y="392" width="1.6" height="16" fill="#FFFFFF"/>
    <rect x="154" y="392" width="1.1" height="16" fill="#FFFFFF"/>
    <rect x="156.5" y="392" width="2.2" height="16" fill="#FFFFFF"/>
    <rect x="160.5" y="392" width="1.1" height="16" fill="#FFFFFF"/>
    <rect x="163" y="392" width="1.6" height="16" fill="#FFFFFF"/>
    <rect x="166.5" y="392" width="1.1" height="16" fill="#FFFFFF"/>
    <text x="160" y="420" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#FFFFFF">Escaneando…</text>

    <!-- chip camara activa -->
    <rect x="112" y="486" width="96" height="22" rx="11" fill="#D5F5DE"/>
    <circle cx="126" cy="497" r="3.5" fill="#0F5226"/>
    <text x="163" y="501" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#0F5226">Cámara activa</text>

    <text x="160" y="524" text-anchor="middle" font-size="9.5" fill="#3F4946">Apunta la parte trasera del teléfono</text>
    <text x="160" y="538" text-anchor="middle" font-size="9.5" fill="#3F4946">al código de barras, a unos 15 cm.</text>

    <!-- cancelar -->
    <rect x="90" y="560" width="140" height="38" rx="9" fill="none" stroke="#0B6B5D" stroke-width="1.4"/>
    <text x="160" y="584" text-anchor="middle" font-size="12" font-weight="bold" fill="#0B6B5D">Cancelar</text>

    <text x="160" y="618" text-anchor="middle" font-size="8" fill="#6F7976">Proporcionado por la app BarcodeScanner</text>
  </g>

  <rect x="4" y="4" width="312" height="652" rx="30" fill="none" stroke="#1a1f2b" stroke-width="4"/>
</svg>
