<svg viewBox="0 0 320 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <clipPath id="screen-login">
      <rect x="8" y="8" width="304" height="644" rx="26"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="320" height="660" rx="32" fill="#0B0F1A"/>

  <g clip-path="url(#screen-login)">
    <rect x="8" y="8" width="304" height="644" fill="#E4ECFB"/>

    <!-- status bar -->
    <rect x="8" y="8" width="304" height="20" fill="#E4ECFB"/>
    <text x="24" y="22" font-size="10" fill="#0B2B66">9:41</text>

    <!-- logo badge -->
    <rect x="128" y="120" width="64" height="64" rx="16" fill="#1E4FB8"/>
    <rect x="146" y="140" width="28" height="24" rx="2" fill="#FFFFFF"/>
    <rect x="152" y="136" width="16" height="6" rx="2" fill="#FFFFFF"/>
    <rect x="150" y="147" width="20" height="2.5" fill="#1E4FB8"/>
    <rect x="150" y="153" width="20" height="2.5" fill="#1E4FB8"/>

    <text x="160" y="210" text-anchor="middle" font-size="18" font-weight="bold" fill="#14203A">Inventario Comex</text>
    <text x="160" y="228" text-anchor="middle" font-size="11" fill="#5C6A82">Control de inventarios físicos</text>

    <!-- username field -->
    <rect x="32" y="264" width="256" height="52" rx="12" fill="#FFFFFF" stroke="#D8DCE4"/>
    <text x="46" y="282" font-size="9" letter-spacing="1" fill="#5C6A82">USUARIO</text>
    <text x="46" y="302" font-size="13" fill="#14203A">jperez</text>

    <!-- password field -->
    <rect x="32" y="326" width="256" height="52" rx="12" fill="#FFFFFF" stroke="#D8DCE4"/>
    <text x="46" y="344" font-size="9" letter-spacing="1" fill="#5C6A82">CONTRASEÑA</text>
    <text x="46" y="364" font-size="13" letter-spacing="2" fill="#14203A">••••••••</text>

    <!-- login button -->
    <rect x="32" y="398" width="256" height="46" rx="10" fill="#1E4FB8"/>
    <text x="160" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Iniciar sesión</text>

    <!-- server footer -->
    <circle cx="140" cy="466" r="6" fill="none" stroke="#5C6A82" stroke-width="1.4"/>
    <path d="M137 466 a3 3 0 0 1 6 0" fill="none" stroke="#5C6A82" stroke-width="1.2"/>
    <text x="152" y="470" font-size="10" fill="#5C6A82">192.168.1.10:8080</text>
  </g>

  <rect x="4" y="4" width="312" height="652" rx="30" fill="none" stroke="#1a1f2b" stroke-width="4"/>
</svg>
